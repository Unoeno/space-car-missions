<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1033">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>우주 자동차 탐험대</title>
<style>
:root{--bg:#0b1033;--card:#1d2668;--ink:#fff;--sub:#b9c3ff;--gold:#ffd23f;--go:#3ddc97;--warn:#ff9f1c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);overscroll-behavior:none;user-select:none;-webkit-user-select:none;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#fff,transparent),
  radial-gradient(2px 2px at 170px 160px,#ffe9a8,transparent),radial-gradient(1px 1px at 60px 190px,#fff,transparent),
  radial-gradient(1.5px 1.5px at 90px 130px,#cfe0ff,transparent);background-size:200px 200px;opacity:.8}
body.morning{background:linear-gradient(#0b1033 0%,#25358a 65%,#e9875a 130%) fixed}
body.evening{background:linear-gradient(#060922,#141a52) fixed}

header{position:sticky;top:0;z-index:5;padding:12px 16px 10px;background:linear-gradient(#0b1033ee 80%,#0b103300)}
.top{display:flex;justify-content:space-between;align-items:center}
nav button{font:inherit;font-size:15px;font-weight:700;color:var(--sub);background:#ffffff14;border:0;border-radius:99px;padding:6px 12px;margin-right:4px}
nav button.on{background:var(--gold);color:#222}
.stars{font-size:22px;font-weight:800;color:var(--gold);transition:transform .2s}
.stars.bump{transform:scale(1.35)}
h1{font-size:22px;margin:10px 0 8px}
.fuel{display:flex;gap:4px;align-items:center}
.fuel b{font-size:18px;margin-right:2px}
.fuel i{flex:1;height:12px;border-radius:6px;background:#ffffff22;transition:background .4s}
.fuel i.on{background:linear-gradient(90deg,var(--go),#a6ff7a);box-shadow:0 0 8px var(--go)}
.road{position:relative;height:34px;margin-top:10px;border-radius:17px;background:#ffffff14;border:2px dashed #ffffff33}
.road .car{position:absolute;top:1px;font-size:24px;transition:left 1s;transform:translateX(-50%) scaleX(-1)}
.road .flag{position:absolute;right:6px;top:3px;font-size:20px}
#left{margin-top:6px;font-size:15px;color:var(--sub);text-align:center}

main{padding:4px 16px 40px;display:flex;flex-direction:column;gap:12px}
.card{position:relative;background:var(--card);border-radius:22px;padding:12px;border:3px solid transparent;transition:background .3s,opacity .3s}
.card.next{border-color:var(--gold);box-shadow:0 0 18px #ffd23f66}
.card.done{background:#174a45;opacity:.85}
.card.hurry{animation:wobble .6s infinite}
@keyframes wobble{25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
.head{display:flex;align-items:center;gap:12px}
.emo{font-size:44px;line-height:1}
.head div{flex:1}
.head b{display:block;font-size:24px}
.head small{font-size:15px;color:var(--sub)}
.late .head small,.hurry .head small{color:var(--warn);font-weight:700}
.badge{font-size:22px}
.track{position:relative;height:58px;margin-top:10px;border-radius:29px;background:#00000040;overflow:hidden}
.track .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#ffffffaa;opacity:calc(1 - var(--p,0) * 2);animation:pulse 1.6s infinite}
@keyframes pulse{50%{color:#fff}}
.track .goal{position:absolute;right:16px;top:12px;font-size:26px}
.knob{position:absolute;top:4px;left:4px;width:50px;height:50px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:30px;touch-action:none;box-shadow:0 3px 10px #0006;transition:left .3s,transform .3s;cursor:grab}
.knob span{transform:scaleX(-1)}
.done .knob{left:calc(100% - 54px);background:var(--go)}
.done .track .hint,.done .goal{opacity:0}
.stamp{position:absolute;left:38%;bottom:22px;padding:4px 12px;border:4px solid #ff4d6d;border-radius:12px;color:#ff4d6d;font-size:20px;font-weight:900;transform:translateX(-50%) rotate(-8deg);background:#ffffffee;display:none}
.done .stamp{display:block}
.card.just .stamp{animation:stamp .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes stamp{from{transform:translateX(-50%) rotate(-8deg) scale(3);opacity:0}}
.fly{position:fixed;z-index:20;font-size:34px;pointer-events:none}

#launch{position:fixed;inset:0;z-index:30;background:#05071cf2;display:flex;align-items:center;justify-content:center;overflow:hidden}
#launch[hidden]{display:none}
#num{font-size:120px;font-weight:900;color:var(--gold);text-shadow:0 0 30px var(--gold)}
#launch .rocket{position:absolute;left:50%;bottom:8%;font-size:96px;transform:translateX(-50%) rotate(-45deg)}
#launch.go .rocket{animation:shake .4s linear 3,up 1.6s .9s ease-in forwards}
@keyframes shake{25%{margin-left:-6px}75%{margin-left:6px}}
@keyframes up{to{bottom:130%}}
#msg{text-align:center;display:none;padding:16px}
#launch.end #msg{display:block}
#launch.end #num{display:none}
#msg h2{font-size:34px;margin-bottom:8px}
#msg p{font-size:22px;color:var(--sub);margin-bottom:24px}
#msg button{font:inherit;font-size:24px;font-weight:800;border:0;border-radius:99px;padding:14px 40px;background:var(--gold);color:#222}
#msg p{white-space:pre-line}

[hidden]{display:none!important}
.topr{display:flex;align-items:center;gap:10px}
.recbtn{font-size:22px;background:#ffffff1a;border:0;border-radius:12px;padding:4px 8px}
#rec{padding:12px 16px 40px}
#rec h2{font-size:20px;margin-bottom:8px}
#back{font:inherit;font-size:16px;font-weight:700;color:#222;background:var(--gold);border:0;border-radius:99px;padding:8px 14px}
.coins{font-size:28px;font-weight:900;color:var(--gold)}
.box{background:var(--card);border-radius:20px;padding:12px;margin-top:12px}
#weekDots{display:flex;justify-content:space-between}
#weekDots span{display:flex;flex-direction:column;align-items:center;font-size:26px;padding:4px;border-radius:12px}
#weekDots small{font-size:13px;color:var(--sub)}
#weekDots .today{background:#ffffff1a}
#weekText{text-align:center;margin-top:6px;font-weight:700;color:var(--gold)}
.calhead{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.calhead button{font-size:18px;background:none;border:0;color:var(--ink);padding:4px 12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr) 1.1fr;gap:4px;margin-top:8px;text-align:center}
.grid i{font-style:normal;font-size:13px;color:var(--sub)}
.grid button{font:inherit;color:var(--ink);background:#ffffff0d;border:2px solid transparent;border-radius:10px;padding:3px 0;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:2px}
.grid em{font-style:normal;font-size:13px;font-weight:700}
.grid button div{font-size:12px;letter-spacing:-2px}
.grid .no{opacity:.2;filter:grayscale(1)}
.grid .full{background:#ffd23f33;border-color:var(--gold)}
.grid .today{border-color:#fff}
.grid .sel{outline:3px solid var(--go)}
.grid .out,.grid .fut{opacity:.35}
.wk{display:flex;align-items:center;justify-content:center;font-size:22px}
.wk.dim{font-size:12px;color:var(--sub)}
.bt{margin:10px 0 4px;font-weight:700;color:var(--sub)}
.row{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid #ffffff14;font-size:16px}
.row.no{opacity:.45}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff14}
.item .emo{font-size:34px}
.item b{flex:1;font-size:18px}
.item button{font:inherit;font-size:17px;font-weight:800;border:0;border-radius:99px;padding:8px 14px;background:var(--gold);color:#222}
.item button:disabled{background:#ffffff22;color:#ffffff77}
</style>
</head>
<body>
<header>
  <div class="top">
    <nav><button data-b="morning">🌞 아침</button><button data-b="evening">🌙 저녁</button></nav>
    <div class="topr"><div class="stars" id="stars">⭐ 0</div><button class="recbtn" id="recBtn" aria-label="기록 보기">📅</button></div>
  </div>
  <h1 id="title"></h1>
  <div class="fuel" id="fuel"></div>
  <div class="road"><div class="car" id="roadCar">🚗</div><span class="flag">🏁</span></div>
  <p id="left"></p>
</header>
<main id="list"></main>
<section id="rec" hidden>
  <div class="top"><button id="back">← 미션으로</button><div class="coins" id="coins">🪙 0</div></div>
  <div class="box"><h2>🚀 이번 주 탐험</h2><div id="weekDots"></div><p id="weekText"></p></div>
  <div class="box">
    <div class="calhead"><button id="prev">◀</button><b id="month"></b><button id="next">▶</button></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="box" id="detail"></div>
  <div class="box"><h2>🎁 코인 상점</h2><div id="shop"></div></div>
</section>
<div id="launch" hidden>
  <div id="num"></div>
  <div class="rocket">🚀</div>
  <div id="msg"><h2></h2><p></p><button id="ok">좋아! 👍</button></div>
</div>

<script>
// 시간표 — 바꾸려면 여기만 고치면 됨 (부모 모드는 3단계)
const BOARDS = {
  morning: { icon:'🌞', title:'아침 미션 — 발사 준비!', start:'07:50', end:'08:40', endWord:'출발',
    doneTitle:'아침 미션 성공!', doneText:'유치원으로 출발~ 🚗💨', items:[
    ['😊','세수하기','08:00'], ['🍚','밥 먹기','08:20'], ['🪥','양치하기','08:25'], ['👕','옷 갈아입기','08:35']] },
  evening: { icon:'🌙', title:'하원 후 미션 — 우주 탐험!', start:'17:30', end:'21:00', endWord:'잠자리',
    doneTitle:'우주 탐험 완료!', doneText:'좋은 꿈 꿔요 🌙✨', items:[
    ['🧩','크레타클레스 하기','18:00'], ['📒','학습지 하기','18:30'], ['🍚','밥 먹기','19:10'], ['🛁','샤워하기','19:40'],
    ['👕','옷 갈아입기','19:50'], ['🧸','장난감 정리하기','20:30'], ['🪥','양치하기','20:40'], ['🛏️','잠자리에 들어가기','21:00']] },
};

// 한 주(월~일)에 하루 미션을 전부 끝낸 날이 이만큼 되면 골드코인 1개
const WEEK_GOAL = 5;
// 코인 상점 — [그림, 이름, 코인 가격]
const REWARDS = [['🍦','아이스크림',1], ['🎬','영화 보기',2], ['🚗','장난감 자동차',3], ['🎡','놀이공원 가기',8]];

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const mins = hhmm => { const [h, m] = hhmm.split(':'); return h * 60 + +m; };
const testTime = new URLSearchParams(location.search).get('t'); // 테스트용: ?t=08:30
function now() {
  const d = new Date();
  if (testTime) d.setHours(...testTime.split(':').map(Number), 0);
  return d;
}
const nowMin = () => { const d = now(); return d.getHours() * 60 + d.getMinutes(); };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayKey = () => 'day:' + ymd(now());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const monday = d => addDays(d, -((d.getDay() + 6) % 7));
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

// ---- 기록 · 골드코인 ----
function store(k, v) {
  try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch {}
}
const dayData = d => store('day:' + ymd(d)) || {};
const boardDone = (s, b) => BOARDS[b].items.every((_, i) => s[b]?.[i]);
const dayDone = s => boardDone(s, 'morning') && boardDone(s, 'evening');
const weekDone = d => [0, 1, 2, 3, 4, 5, 6].filter(k => dayDone(dayData(addDays(monday(d), k)))).length;
function earned() { // 목표를 채운 주 하나당 코인 1개
  let keys = [];
  try { keys = Object.keys(localStorage).filter(k => k.startsWith('day:')); } catch {}
  const weeks = new Set(keys.map(k => ymd(monday(fromYmd(k.slice(4))))));
  return [...weeks].filter(w => weekDone(fromYmd(w)) >= WEEK_GOAL).length;
}
const spent = () => store('spent') || [];
const balance = () => earned() - spent().reduce((a, x) => a + x.price, 0);
const autoBoard = () => now().getHours() < 12 ? 'morning' : 'evening';
const fmt = m => m >= 60 ? `${Math.floor(m/60)}시간 ${m%60 ? m%60 + '분' : ''}`.trim() : `${m}분`;

let key = dayKey(), state = load(), auto = autoBoard(), board = auto, dragging = false;
function load() { return { morning:{}, evening:{}, ...store(key) }; }
function save() { store(key, state); }

// ---- 소리 · 음성 · 진동 ----
let ac;
function audio() { ac ??= new AudioContext(); if (ac.state === 'suspended') ac.resume(); return ac; }
function notes(freqs, type = 'triangle', step = .11) {
  const a = audio(); let t = a.currentTime;
  for (const f of freqs) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + step * 2.5);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + step * 3); t += step;
  }
}
function whoosh() {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = 'sawtooth'; o.frequency.setValueAtTime(80, t); o.frequency.exponentialRampToValueAtTime(900, t + 2.2);
  g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + 2.4);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + 2.5);
}
function say(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = .95; u.pitch = 1.2;
  speechSynthesis.speak(u);
}
const buzz = p => navigator.vibrate?.(p);

// ---- 화면 그리기 ----
function render() {
  const B = BOARDS[board], done = state[board], t = nowMin();
  document.body.className = board;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.b === board));
  $('#title').textContent = `${B.icon} ${B.title}`;
  const total = Object.values(state).flatMap(Object.values).reduce((a, b) => a + b, 0);
  $('#stars').textContent = `⭐ ${total}`;
  $('#fuel').innerHTML = '<b>⛽</b>' + B.items.map((_, i) => `<i class="${done[i] ? 'on' : ''}"></i>`).join('');

  const s = mins(B.start), e = mins(B.end), allDone = B.items.every((_, i) => done[i]);
  $('#roadCar').style.left = `calc(8% + ${Math.min(1, Math.max(0, (t - s) / (e - s))) * 78}%)`;
  $('#left').textContent = allDone ? '미션 완료! 🎉 최고야!'
    : t < s ? `${B.start}에 미션 시작!`
    : t <= e ? `${B.endWord}까지 ${fmt(e - t)} 남았어요`
    : '시간이 지났지만 끝까지 해 보자! 💪';

  const next = B.items.findIndex((_, i) => !done[i]);
  $('#list').innerHTML = B.items.map(([emo, name, dl], i) => {
    const left = mins(dl) - t;
    const cls = done[i] ? 'done' : [i === next && 'next', left < 0 ? 'late' : left <= 5 && 'hurry'].filter(Boolean).join(' ');
    const sub = done[i] ? `⏰ ${dl}까지` : left < 0 ? `⏰ ${dl} · 늦어도 괜찮아!` : left <= 5 ? `⏰ ${dl}까지 · 서둘러!` : `⏰ ${dl}까지`;
    return `<section class="card ${cls}" data-i="${i}">
      <div class="head"><span class="emo">${emo}</span><div><b>${name}</b><small>${sub}</small></div>
        <span class="badge">${'⭐'.repeat(done[i] || 0)}</span></div>
      <div class="track"><span class="hint">자동차를 밀어 주세요 →</span><span class="goal">🏁</span><div class="knob"><span>🚗</span></div></div>
      <div class="stamp">참 잘했어요!</div></section>`;
  }).join('');
}

function tick() {
  if (dragging || !$('#launch').hidden) return;
  if (dayKey() !== key) { key = dayKey(); state = load(); }
  if (autoBoard() !== auto) board = auto = autoBoard();
  render();
}

// ---- 미션 완료 / 되돌리기 ----
function complete(i, knob) {
  const B = BOARDS[board], [, name, dl] = B.items[i];
  const stars = nowMin() <= mins(dl) ? 2 : 1; // 제시간 ⭐⭐, 늦어도 ⭐
  const before = weekDone(now());
  state[board][i] = stars; save();
  const coin = before < WEEK_GOAL && weekDone(now()) >= WEEK_GOAL;
  notes([523, 659, 784, 1047]); buzz([60, 40, 140]);
  const from = knob.getBoundingClientRect();
  render();
  $(`.card[data-i="${i}"]`).classList.add('just');
  for (let k = 0; k < stars; k++) setTimeout(() => flyStar(from), k * 180);
  if (B.items.every((_, j) => state[board][j])) setTimeout(() => launch(coin), 900);
  else say(`${name} 완료! 참 잘했어요!`);
}
function undo(i) {
  delete state[board][i]; save();
  notes([392, 262], 'sine', .14); buzz(40);
  render();
}
function flyStar(from) {
  const to = $('#stars').getBoundingClientRect(), el = document.createElement('div');
  el.className = 'fly'; el.textContent = '⭐'; document.body.append(el);
  el.animate([
    { left: `${from.left}px`, top: `${from.top}px`, transform: 'scale(1)' },
    { left: `${(from.left + to.left) / 2}px`, top: `${Math.min(from.top, to.top) - 60}px`, transform: 'scale(1.8) rotate(180deg)' },
    { left: `${to.left}px`, top: `${to.top}px`, transform: 'scale(.6) rotate(360deg)' }
  ], { duration: 800, easing: 'ease-in-out' }).onfinish = () => {
    el.remove(); notes([1319], 'sine', .08);
    $('#stars').classList.add('bump'); setTimeout(() => $('#stars').classList.remove('bump'), 200);
  };
}

async function launch(coin) {
  const ov = $('#launch'), B = BOARDS[board];
  ov.hidden = false; ov.className = '';
  for (const [n, w] of [[3, '셋'], [2, '둘'], [1, '하나']]) {
    $('#num').textContent = n; say(w); notes([440], 'square', .15); buzz(80); await sleep(1000);
  }
  $('#num').textContent = '발사!'; say('발사!'); ov.className = 'go'; whoosh(); buzz([200, 100, 400]);
  for (let k = 0; k < 40; k++) setTimeout(burst, 900 + k * 40);
  await sleep(2600);
  ov.querySelector('h2').textContent = `🎉 ${B.doneTitle}`;
  ov.querySelector('p').textContent = B.doneText + (coin ? '\n\n🪙 이번 주 골드코인 획득!' : '');
  ov.className = 'go end'; notes([523, 659, 784, 1047, 784, 1047], 'triangle', .14);
  say(B.doneTitle + (coin ? ' 골드코인도 받았어요!' : ''));
}
function burst() {
  const el = document.createElement('div');
  el.className = 'fly'; el.textContent = ['⭐', '✨', '🌟', '💫'][Math.random() * 4 | 0];
  el.style.left = '50%'; el.style.top = '50%'; $('#launch').append(el);
  const a = Math.random() * 6.28, r = 150 + Math.random() * 250;
  el.animate([{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 },
    { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r}px)) scale(1.4)`, opacity: 0 }],
    { duration: 1400, easing: 'ease-out' }).onfinish = () => el.remove();
}
$('#ok').onclick = () => { $('#launch').hidden = true; render(); };

// ---- 제스처: 자동차를 밀어서 완료, 다시 왼쪽으로 밀면 되돌리기 ----
$('#list').addEventListener('pointerdown', e => {
  const knob = e.target.closest('.knob');
  if (!knob) return;
  audio();
  const card = knob.closest('.card'), i = +card.dataset.i, wasDone = card.classList.contains('done');
  const max = knob.parentElement.clientWidth - knob.offsetWidth - 8, x0 = e.clientX;
  let d = 0, lastStep = 0;
  dragging = true; knob.setPointerCapture(e.pointerId); knob.style.transition = 'none';
  const move = ev => {
    d = Math.max(wasDone ? -max : 0, Math.min(wasDone ? 0 : max, ev.clientX - x0));
    knob.style.transform = `translateX(${d}px)`;
    card.style.setProperty('--p', Math.abs(d) / max);
    const step = Math.floor(Math.abs(d) / max * 5); // 밀 때 "부릉" 하는 짧은 소리
    if (step > lastStep) { notes([200 + step * 60], 'sawtooth', .05); buzz(10); }
    lastStep = step;
  };
  const up = () => {
    knob.removeEventListener('pointermove', move); knob.removeEventListener('pointerup', up); knob.removeEventListener('pointercancel', up);
    dragging = false; knob.style.transition = ''; card.style.removeProperty('--p');
    const p = Math.abs(d) / max;
    if (p > .8) wasDone ? undo(i) : complete(i, knob);
    else knob.style.transform = '';
  };
  knob.addEventListener('pointermove', move); knob.addEventListener('pointerup', up); knob.addEventListener('pointercancel', up);
});
// 그림이나 이름을 누르면 읽어 주기
$('#list').addEventListener('click', e => {
  const head = e.target.closest('.head');
  if (head) say(BOARDS[board].items[+head.parentElement.dataset.i][1]);
});
document.querySelector('nav').addEventListener('click', e => {
  if (e.target.dataset.b) { board = e.target.dataset.b; render(); }
});

// ---- 기록 페이지: 이번 주, 달력, 하루 상세, 코인 상점 ----
let calMonth, selDay;
function showRec(on) {
  $('header').hidden = $('#list').hidden = on; $('#rec').hidden = !on;
  if (on) { calMonth = new Date(now().getFullYear(), now().getMonth(), 1); selDay = ymd(now()); renderRec(); scrollTo(0, 0); }
  else render();
}
function renderRec() {
  const today = ymd(now()), coins = balance();
  $('#coins').textContent = `🪙 ${coins}`;

  const n = weekDone(now());
  $('#weekDots').innerHTML = [...'월화수목금토일'].map((w, k) => {
    const d = addDays(monday(now()), k), ok = dayDone(dayData(d));
    return `<span class="${ymd(d) === today ? 'today' : ''}"><small>${w}</small>${ok ? '🌟' : ymd(d) > today ? '⚪' : '🌑'}</span>`;
  }).join('');
  $('#weekText').textContent = n >= WEEK_GOAL ? '이번 주 골드코인 획득! 🪙' : `${WEEK_GOAL - n}일 더 성공하면 골드코인 🪙`;

  const mo = calMonth.getMonth();
  $('#month').textContent = `${calMonth.getFullYear()}년 ${mo + 1}월`;
  let html = [...'월화수목금토일', '🪙'].map(w => `<i>${w}</i>`).join('');
  for (let w = monday(calMonth); w.getMonth() === mo || w < calMonth; w = addDays(w, 7)) {
    let cnt = 0;
    for (let k = 0; k < 7; k++) {
      const d = addDays(w, k), s = dayData(d), key = ymd(d), full = dayDone(s);
      cnt += full;
      const cls = [d.getMonth() !== mo && 'out', key > today && 'fut', full && 'full', key === today && 'today', key === selDay && 'sel'].filter(Boolean).join(' ');
      html += `<button class="${cls}" data-d="${key}"><em>${d.getDate()}</em>` +
        (key > today ? '' : `<div><span class="${boardDone(s, 'morning') ? '' : 'no'}">🌞</span><span class="${boardDone(s, 'evening') ? '' : 'no'}">🌙</span></div>`) + '</button>';
    }
    html += cnt >= WEEK_GOAL ? '<b class="wk">🪙</b>' : `<b class="wk dim">${cnt}/${WEEK_GOAL}</b>`;
  }
  $('#grid').innerHTML = html;

  const d = fromYmd(selDay), s = dayData(d);
  $('#detail').innerHTML = `<h2>📋 ${d.getMonth() + 1}월 ${d.getDate()}일 미션</h2>` +
    Object.entries(BOARDS).map(([b, B]) => `<p class="bt">${B.icon} ${b === 'morning' ? '아침' : '하원 후'} ${boardDone(s, b) ? '— 성공! 🚀' : ''}</p>` +
      B.items.map(([emo, name], i) => `<div class="row ${s[b]?.[i] ? '' : 'no'}"><span>${emo} ${name}</span><span>${s[b]?.[i] ? '⭐'.repeat(s[b][i]) : '—'}</span></div>`).join('')).join('');

  const sp = spent();
  $('#shop').innerHTML = REWARDS.map(([emo, name, price], i) =>
    `<div class="item"><span class="emo">${emo}</span><b>${name}</b><button data-r="${i}" ${coins < price ? 'disabled' : ''}>🪙 ${price}</button></div>`).join('') +
    (sp.length ? '<p class="bt">🎁 받은 선물</p>' + sp.slice().reverse().map(x => `<div class="row"><span>${x.emo} ${x.name}</span><span>${x.date}</span></div>`).join('') : '');
}
$('#recBtn').onclick = () => showRec(true);
$('#back').onclick = () => showRec(false);
$('#prev').onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderRec(); };
$('#next').onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderRec(); };
$('#grid').onclick = e => { const b = e.target.closest('button'); if (b) { selDay = b.dataset.d; renderRec(); } };
$('#shop').onclick = e => {
  const r = e.target.closest('button')?.dataset.r;
  if (r == null) return;
  const [emo, name, price] = REWARDS[r], a = 3 + Math.random() * 7 | 0, b = 3 + Math.random() * 7 | 0;
  if (prompt(`👨‍👩‍👦 부모님 확인\n${a} × ${b} = ?`) != a * b) return alert('부모님과 함께 바꿔요!');
  store('spent', [...spent(), { emo, name, price, date: ymd(now()) }]);
  notes([523, 784, 1047, 1319]); buzz([60, 40, 140]); say(`${name}! 축하해요!`);
  renderRec();
};

render();
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => !document.hidden && tick());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
